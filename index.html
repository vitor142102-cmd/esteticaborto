function useMedia(query) {
  const [match, setMatch] = useState(() => window.matchMedia(query).matches);

  }, [query]);

function Logo({ size = 'md' }) {

function Eyebrow({ children, className = '' }) {

function Reveal({ children, delay = 0, y = 40, className = '', as = 'div' }) {
  const M = motion[as];
  return (
    <M className={className} initial={{ opacity: 0, y }} whileInView={{ opacity: 1, y: 0 }}

// Palavras que sobem de dentro de uma máscara
function RiseWords({ text, className = '', delay = 0, show = true, stagger = 0.07 }) {
  const words = text.split(' ');
  return words.map((w, i) => (
    <span key={i} className="inline-block overflow-hidden align-bottom pb-[.06em] -mb-[.06em]">
      <motion.span className={`inline-block ${className}`} initial={{ y: '110%' }}
        animate={show ? { y: '0%' } : { y: '110%' }}
        transition={{ duration: 1, ease, delay: delay + i * stagger }}>
        {w}
      </motion.span>
      {i < words.length - 1 ? ' ' : ''}
    </span>
  ));
}

function Magnetic({ children, strength = 0.3, className = '' }) {
  const ref = useRef(null);
  const x = useSpring(0, { stiffness: 220, damping: 16 });
  const y = useSpring(0, { stiffness: 220, damping: 16 });
  return (
    <motion.div ref={ref} style={{ x, y }} className={`inline-block ${className}`}
      onPointerMove={(e) => {
        if (e.pointerType !== 'mouse') return;
        const r = ref.current.getBoundingClientRect();
        x.set((e.clientX - (r.left + r.width / 2)) * strength);
        y.set((e.clientY - (r.top + r.height / 2)) * strength);
      }}
      onPointerLeave={() => { x.set(0); y.set(0); }}>
      {children}
    </motion.div>
  );
}

function BtnPrimary({ href, children, className = '', ...rest }) {

/* ------------------------------------------------------------------ */
/* Infra: scroll suave, barra de progresso, intro                      */
/* ------------------------------------------------------------------ */
function useSmoothScroll(enabled) {
  useEffect(() => {
    if (!enabled || !window.Lenis) return;
    const lenis = new window.Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
    window.__lenis = lenis;
    let id;
    const raf = (t) => { lenis.raf(t); id = requestAnimationFrame(raf); };
    id = requestAnimationFrame(raf);
    return () => { cancelAnimationFrame(id); lenis.destroy(); window.__lenis = null; };
  }, [enabled]);

  useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href');
      const el = id === '#inicio' ? 0 : document.querySelector(id);
      if (el === null) return;
      e.preventDefault();
      if (window.__lenis) window.__lenis.scrollTo(el, { offset: -70, duration: 1.6 });
      else if (el === 0) window.scrollTo({ top: 0, behavior: 'smooth' });
      else el.scrollIntoView({ behavior: 'smooth' });
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);
}

function ScrollProgress() {
  const { scrollYProgress } = useScroll();
  const scaleX = useSpring(scrollYProgress, { stiffness: 140, damping: 30 });
  return <motion.div style={{ scaleX }} className="fixed inset-x-0 top-0 z-[90] h-[3px] origin-left bg-volt shadow-volt" />;
}

                initial={{ x: '-120%' }} animate={{ x: '320%' }} transition={{ duration: 1.1, ease: 'easeInOut', delay: 0.35 }} />

}

/* ------------------------------------------------------------------ */
/* Header                                                              */
/* ------------------------------------------------------------------ */
const NAV = [
  ['#servicos', 'Serviços'],
  ['#resultados', 'Antes & depois'],
  ['#coating', 'Coating'],
  ['#processo', 'Processo'],

function Header({ ready }) {

/* ------------------------------------------------------------------ */
/* HERO: o visitante "pole" o carro com o mouse                        */
/* ------------------------------------------------------------------ */
// cover = a foto preenche o painel inteiro (com foco em focus[x,y]); sem cover = carro recortado sobre fundo preto
function PolishStage({ ready, mobile, onProgress, apiRef, className = '', src = IMG.hero, cover = false, focus = [0.5, 0.5], alt = '' }) {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const padRef = useRef(null);
  const readyRef = useRef(ready);
  const startDemoRef = useRef(() => {});
  const [failed, setFailed] = useState(false);

  useEffect(() => { readyRef.current = ready; if (ready) startDemoRef.current(); }, [ready]);

  useEffect(() => {
    const wrap = wrapRef.current, canvas = canvasRef.current, pad = padRef.current;
    const ctx = canvas.getContext('2d');
    const MS = 4; // a máscara de polimento roda em 1/4 da resolução
    let W = 0, H = 0, dpr = 1, R = { x: 0, y: 0, w: 1, h: 1 };
    let dull, gloss, lum, tmp, streak, mask, mctx;
    let last = null, progress = 0, done = false, visible = true, raf = 0, loaded = false;
    let demo = null, demoDone = false, finishing = null, needCheck = false, lastCheck = 0, lastReport = -1, touched = false;
    const t0 = performance.now();
    const padR = () => (mobile ? 42 : 60);
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

    pad.style.width = pad.style.height = padR() * 2 + 'px';

    const img = new Image();
    if (/^https?:\/\//.test(src)) img.crossOrigin = 'anonymous'; // fotos locais não precisam (e quebram no file://)
    const area = () => (cover ? { x: 0, y: 0, w: W, h: H } : R);
    img.onload = () => {
      loaded = true; setup();
      if (new URLSearchParams(location.search).has('polido')) { demoDone = true; finish(); return; } // teste
      if (readyRef.current) startDemo();
    };
    img.onerror = () => setFailed(true);
    img.src = src;

    function place() {
      const ar = img.naturalWidth / img.naturalHeight;
      if (cover) {
        const s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
        const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
        R = { w: dw, h: dh, x: (W - dw) * focus[0], y: (H - dh) * focus[1] };
        return;
      }
      if (!mobile) {
        let dw = W * 0.7, dh = dw / ar;
        if (dh > H * 1.02) { dh = H * 1.02; dw = dh * ar; }
        R = { w: dw, h: dh, x: W - dw + W * 0.03, y: H - dh * 0.97 };
      } else {
        const dw = W * 1.22, dh = dw / ar;
        R = { w: dw, h: dh, x: (W - dw) / 2, y: (H - dh) / 2 };
      }
    }

    function feather(c) {
      const f = (x0, y0, x1, y1) => {
        const g = c.createLinearGradient(x0, y0, x1, y1);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
        c.globalCompositeOperation = 'destination-in'; c.fillStyle = g; c.fillRect(0, 0, W, H);
      };
      const fx = R.w * 0.12, fy = R.h * 0.14;
      f(R.x, 0, R.x + fx, 0); f(R.x + R.w, 0, R.x + R.w - fx, 0);
      f(0, R.y, 0, R.y + fy); f(0, R.y + R.h, 0, R.y + R.h - fy);
      c.globalCompositeOperation = 'source-over';
    }

    function build() {
      const draw = (c) => c.drawImage(img, R.x, R.y, R.w, R.h);
      // Luminância amplificada: onde há lataria (para reflexos e riscos)
      lum = mk(W, H); const l = lum.getContext('2d');
      draw(l); l.globalCompositeOperation = 'saturation'; l.fillStyle = '#808080'; l.fillRect(0, 0, W, H);
      const lum0 = mk(W, H); lum0.getContext('2d').drawImage(lum, 0, 0); // luminância sem amplificar
      const cp = mk(W, H); const cpc = cp.getContext('2d');
      for (let i = 0; i < 3; i++) { cpc.clearRect(0, 0, W, H); cpc.drawImage(lum, 0, 0); l.globalCompositeOperation = 'screen'; l.drawImage(cp, 0, 0); }
      l.globalCompositeOperation = 'source-over';

      // Versão polida: mais contraste e profundidade
      gloss = mk(W, H); const g = gloss.getContext('2d');
      draw(g); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = 0.6; draw(g);
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; if (!cover) feather(g);

      // Versão "antes": sem cor, opaca, com véu e marcas circulares (swirls)
      dull = mk(W, H); const d = dull.getContext('2d');
      draw(d);
      d.globalCompositeOperation = 'saturation'; d.globalAlpha = 0.8; d.fillStyle = '#808080'; d.fillRect(0, 0, W, H);
      d.globalAlpha = 1; d.globalCompositeOperation = 'multiply'; d.fillStyle = 'rgb(128,126,122)'; d.fillRect(0, 0, W, H);
      const small = mk(W / 22, H / 22); small.getContext('2d').drawImage(img, R.x / 22, R.y / 22, R.w / 22, R.h / 22);
      d.globalCompositeOperation = 'screen'; d.globalAlpha = 0.65; d.imageSmoothingEnabled = true; d.drawImage(small, 0, 0, W, H);
      const sw = mk(W, H); const s = sw.getContext('2d');
      s.fillStyle = '#000'; s.fillRect(0, 0, W, H);
      s.strokeStyle = 'rgba(255,255,255,.9)'; s.lineWidth = Math.max(1, dpr * 0.6);
      for (let k = 0; k < 7; k++) {
        const a = area();
        const cx = a.x + a.w * (0.15 + Math.random() * 0.7), cy = a.y + a.h * (cover ? 0.12 + Math.random() * 0.7 : 0.45 + Math.random() * 0.35);
        for (let r = 6 * dpr; r < a.w * 0.3; r += (4 + Math.random() * 5) * dpr) {
          const a0 = Math.random() * Math.PI * 2;
          s.beginPath(); s.arc(cx, cy, r, a0, a0 + 0.4 + Math.random() * 1.6); s.stroke();
        }
      }
      // riscos só aparecem onde a luz bate na lataria, como na vida real
      s.globalCompositeOperation = 'multiply'; s.drawImage(lum0, 0, 0); s.drawImage(lum0, 0, 0);
      d.globalCompositeOperation = 'screen'; d.globalAlpha = 0.75; d.drawImage(sw, 0, 0);
      d.globalAlpha = 1; d.globalCompositeOperation = 'source-over'; if (!cover) feather(d);

      tmp = mk(W, H);
      streak = mk(W / 2, H / 2);
    }

    function setup() {
      const r = wrap.getBoundingClientRect();
      if (!r.width || !loaded) return;
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      W = Math.round(r.width * dpr); H = Math.round(r.height * dpr);
      canvas.width = W; canvas.height = H;
      place(); build();
      mask = mk(W / MS, H / MS); mctx = mask.getContext('2d');
      if (done) { mctx.fillStyle = '#fff'; mctx.fillRect(0, 0, mask.width, mask.height); }
      progress = done ? 1 : 0; last = null; report(true);
    }

    function report(force) {
      const v = done ? 1 : Math.min(1, progress / 0.6);
      const q = Math.round(v * 100);
      if (force || q !== lastReport) { lastReport = q; onProgress && onProgress(q / 100); }
    }

    function stamp(x, y, radius) {
      const r = (radius || padR()) * dpr / MS, px = x * dpr / MS, py = y * dpr / MS;
      const g = mctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.55, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      mctx.fillStyle = g; mctx.beginPath(); mctx.arc(px, py, r, 0, Math.PI * 2); mctx.fill();
    }
    function polishTo(x, y) {
      if (!mctx) return;
      if (last) {
        const dx = x - last.x, dy = y - last.y, n = Math.ceil(Math.hypot(dx, dy) / (padR() * 0.3));
        for (let i = 1; i <= n; i++) stamp(last.x + dx * i / n, last.y + dy * i / n);
      } else stamp(x, y);
      last = { x, y }; needCheck = true;
    }
    function measure() {
      const a = area(), [ya, yb] = cover ? [0.08, 0.92] : [0.45, 0.82];
      const x0 = Math.max(0, Math.floor((a.x + a.w * 0.08) / MS)), x1 = Math.min(mask.width, Math.ceil((a.x + a.w * 0.9) / MS));
      const y0 = Math.max(0, Math.floor((a.y + a.h * ya) / MS)), y1 = Math.min(mask.height, Math.ceil((a.y + a.h * yb) / MS));
      if (x1 <= x0 || y1 <= y0) return;
      const d = mctx.getImageData(x0, y0, x1 - x0, y1 - y0).data;
      let c = 0, n = 0;
      for (let i = 3; i < d.length; i += 12) { n++; if (d[i] > 150) c++; }
      progress = c / n; report();
      if (!done && touched && progress >= 0.6) finish();
    }
    function finish() {
      if (done || !mctx) return;
      done = true;
      const a = area();
      const from = last || { x: (a.x + a.w * 0.5) / dpr, y: (a.y + a.h * (cover ? 0.45 : 0.62)) / dpr };
      finishing = { t: performance.now(), x: from.x, y: from.y };
    }
    function reset() {
      done = false; finishing = null; progress = 0; last = null;
      if (mctx) mctx.clearRect(0, 0, mask.width, mask.height);
      report(true);
    }

    const movePad = (x, y) => { const r = padR(); pad.style.transform = `translate3d(${x - r}px, ${y - r}px, 0)`; pad.style.opacity = '1'; };
    const hidePad = () => { pad.style.opacity = '0'; };

    function startDemo() {
      if (!loaded || demoDone) return;
      demoDone = true; demo = { t: performance.now() + 250 }; last = null;
    }
    startDemoRef.current = startDemo;

    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!loaded || !visible || !W) return;
      if (demo && now >= demo.t) {
        // Demonstração: pole só a metade traseira, para mostrar o antes e depois lado a lado
        const k = (now - demo.t) / 2400;
        if (k >= 1) { demo = null; last = null; hidePad(); needCheck = true; }
        else {
          const a = area();
          const x = (a.x + a.w * (0.1 + (cover ? 0.42 : 0.36) * k)) / dpr;
          const y = (a.y + a.h * ((cover ? 0.42 : 0.62) + (cover ? 0.16 : 0.08) * Math.sin(k * Math.PI * 5))) / dpr;
          movePad(x, y); polishTo(x, y);
        }
      }
      if (finishing) {
        const k = Math.min(1, (now - finishing.t) / 1100), e = 1 - Math.pow(1 - k, 3);
        stamp(finishing.x, finishing.y, (Math.hypot(W, H) / dpr) * e + 40);
        if (k >= 1) { mctx.fillStyle = '#fff'; mctx.fillRect(0, 0, mask.width, mask.height); finishing = null; report(true); }
      }

      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(dull, 0, 0);

      const t = tmp.getContext('2d');
      t.globalCompositeOperation = 'source-over'; t.clearRect(0, 0, W, H); t.drawImage(gloss, 0, 0);
      // Reflexo de luz correndo pela lataria polida
      const s = streak.getContext('2d'), sw = streak.width, sh = streak.height;
      const ph = ((now - t0) / 4200) % 1, cx = (R.x - R.w * 0.3 + ph * R.w * 1.6) / 2;
      s.globalCompositeOperation = 'source-over'; s.fillStyle = '#000'; s.fillRect(0, 0, sw, sh);
      const gr = s.createLinearGradient(cx - R.w * 0.08, 0, cx + R.w * 0.08, R.h * 0.12);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,248,225,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      s.fillStyle = gr; s.fillRect(0, 0, sw, sh);
      s.globalCompositeOperation = 'multiply'; s.drawImage(lum, 0, 0, sw, sh);
      t.globalCompositeOperation = 'screen'; t.globalAlpha = cover ? 0.3 : 0.55; t.drawImage(streak, 0, 0, W, H); t.globalAlpha = 1;
      t.globalCompositeOperation = 'destination-in'; t.drawImage(mask, 0, 0, W, H);
      ctx.drawImage(tmp, 0, 0);

      if (needCheck && now - lastCheck > 160) { lastCheck = now; needCheck = false; measure(); }
    }
    raf = requestAnimationFrame(frame);

    const local = (e) => { const r = wrap.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const onMove = (e) => {
      if (e.pointerType !== 'mouse' && !e.buttons) return;
      const [x, y] = local(e);
      if (demo) { demo = null; last = null; }
      touched = true;
      movePad(x, y);
      if (!done) polishTo(x, y);
    };
    const onDown = (e) => { last = null; onMove(e); };
    const onLeave = () => { last = null; if (!demo) hidePad(); };
    const onUp = (e) => { if (e.pointerType !== 'mouse') onLeave(); };
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointerleave', onLeave);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointercancel', onLeave);

    let to;
    const ro = new ResizeObserver(() => { clearTimeout(to); to = setTimeout(setup, 120); });
    ro.observe(wrap);
    const io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; }, { threshold: 0 });
    io.observe(wrap);

    if (apiRef) apiRef.current = { finish, reset };

    return () => {
      cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); clearTimeout(to);
      wrap.removeEventListener('pointermove', onMove); wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointerleave', onLeave); wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointercancel', onLeave);
    };
  }, [mobile, src, cover]);

  return (
    <div ref={wrapRef} className={`relative touch-pan-y select-none ${mobile ? '' : 'cursor-none'} ${className}`}>
      <canvas ref={canvasRef} className="absolute inset-0 h-full w-full" aria-label={`${alt}: passe o mouse para polir a pintura`} role="img" />
      {failed && (
        <img src={src} alt={alt} className={`absolute inset-0 h-full w-full ${cover ? 'object-cover' : 'object-contain object-right-bottom'}`} />
      )}
      <div ref={padRef} className="pad" aria-hidden="true" />
    </div>
  );
}

function polar(a, r, c = 100) { const t = (a * Math.PI) / 180; return [c + r * Math.sin(t), c - r * Math.cos(t)]; }

// Conta-giros que mede o brilho
function GlossGauge({ value }) {
  const v = useSpring(0, { stiffness: 70, damping: 16 });
  const needleRef = useRef(null);
  const [pct, setPct] = useState(0);
  useEffect(() => { v.set(value); }, [value]);
  useMotionValueEvent(v, 'change', (x) => {
    setPct(Math.round(x * 100));
    if (needleRef.current) needleRef.current.setAttribute('transform', `rotate(${-120 + x * 240} 100 100)`);
  });
  const [sx, sy] = polar(-120, 78), [ex, ey] = polar(120, 78);
  const arc = `M ${sx} ${sy} A 78 78 0 1 1 ${ex} ${ey}`;
  return (
    <svg viewBox="0 0 200 150" className="w-full" aria-hidden="true">
      <path d={arc} fill="none" stroke="rgba(255,255,255,.08)" strokeWidth="10" strokeLinecap="round" />
      <motion.path d={arc} fill="none" stroke="#FFC400" strokeWidth="10" strokeLinecap="round" style={{ pathLength: v }}
        filter="drop-shadow(0 0 6px rgba(255,196,0,.6))" />
      {Array.from({ length: 21 }).map((_, i) => {
        const a = -120 + i * 12, major = i % 5 === 0;
        const [x1, y1] = polar(a, major ? 62 : 66), [x2, y2] = polar(a, 70);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={i >= 15 ? '#FFC400' : 'rgba(255,255,255,.45)'} strokeWidth={major ? 2.2 : 1.2} />;
      })}
      {[0, 25, 50, 75, 100].map((n, i) => {
        const [x, y] = polar(-120 + i * 60, 50);
        return <text key={n} x={x} y={y + 3} textAnchor="middle" fill="rgba(255,255,255,.45)" fontSize="9" fontFamily="Chakra Petch">{n}</text>;
      })}
      <g ref={needleRef} transform="rotate(-120 100 100)">
        <line x1="100" y1="108" x2="100" y2="34" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" />
      </g>
      <circle cx="100" cy="100" r="7" fill="#FFC400" />
      <circle cx="100" cy="100" r="3" fill="#050506" />
      <text x="100" y="138" textAnchor="middle" fill="#fff" fontSize="22" fontWeight="600" fontFamily="Chakra Petch">{pct}<tspan fontSize="12" fill="#FFC400">%</tspan></text>
    </svg>
  );
}

/* ------------------------------------------------------------------ */
const wrapRange = (min, max, v) => { const r = max - min; return ((((v - min) % r) + r) % r) + min; };

function VelocityRow({ children, base = -2, className = '' }) {
  const baseX = useMotionValue(0);
  const { scrollY } = useScroll();
  const vel = useVelocity(scrollY);
  const smooth = useSpring(vel, { damping: 50, stiffness: 400 });
  const factor = useTransform(smooth, [0, 1000], [0, 4], { clamp: false });
  const x = useTransform(baseX, (v) => `${wrapRange(-25, -50, v)}%`);
  const dir = useRef(1);
  useAnimationFrame((t, delta) => {
    let move = dir.current * base * (delta / 1000);
    if (factor.get() < 0) dir.current = -1; else if (factor.get() > 0) dir.current = 1;
    move += dir.current * move * factor.get();
    baseX.set(baseX.get() + move);
  });
  return (
    <div className="flex overflow-hidden whitespace-nowrap">
      <motion.div className={`flex whitespace-nowrap ${className}`} style={{ x }}>
        {[0, 1, 2, 3].map((i) => <span key={i} className="flex shrink-0 items-center">{children}</span>)}
      </motion.div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Coating: gotas de água que fogem do cursor                          */
/* ------------------------------------------------------------------ */
function WaterBeads({ className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current, ctx = canvas.getContext('2d');
    let W = 0, H = 0, dpr = 1, drops = [], bg, raf = 0, visible = true;
    let mouse = { x: -9999, y: -9999, t: 0 };
    const rand = (a, b) => a + Math.random() * (b - a);
    const newDrop = (top) => {
      const big = Math.random() < 0.18;
      const r = (big ? rand(8, 15) : rand(2.2, 7)) * dpr;
      return { x: rand(0, W), y: top ? rand(-H * 0.3, -r) : rand(0, H), r, vx: 0, vy: 0, w: rand(0.85, 1.1) };
    };
    function setup() {
      const rc = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = Math.round(rc.width * dpr); H = canvas.height = Math.round(rc.height * dpr);
      bg = document.createElement('canvas'); bg.width = W; bg.height = H;
      const b = bg.getContext('2d');
      const base = b.createLinearGradient(0, 0, 0, H);
      base.addColorStop(0, '#16171a'); base.addColorStop(0.5, '#0a0a0c'); base.addColorStop(1, '#040405');
      b.fillStyle = base; b.fillRect(0, 0, W, H);
      // reflexo da luz do estúdio na pintura
      const ref1 = b.createLinearGradient(W * 0.1, 0, W * 0.6, H);
      ref1.addColorStop(0.35, 'rgba(255,255,255,0)'); ref1.addColorStop(0.47, 'rgba(255,255,255,.13)');
      ref1.addColorStop(0.5, 'rgba(255,255,255,.22)'); ref1.addColorStop(0.53, 'rgba(255,255,255,.1)'); ref1.addColorStop(0.65, 'rgba(255,255,255,0)');
      b.fillStyle = ref1; b.fillRect(0, 0, W, H);
      const ref2 = b.createLinearGradient(W * 0.5, 0, W, H * 0.9);
      ref2.addColorStop(0.55, 'rgba(255,196,0,0)'); ref2.addColorStop(0.62, 'rgba(255,196,0,.08)'); ref2.addColorStop(0.7, 'rgba(255,196,0,0)');
      b.fillStyle = ref2; b.fillRect(0, 0, W, H);
      const n = Math.min(240, Math.round((W * H) / (dpr * dpr) / 2300));
      drops = Array.from({ length: n }, () => newDrop(false));
    }
    function drawDrop(d) {
      const { x, y, r } = d;
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath(); ctx.ellipse(x + r * 0.22, y + r * 0.3, r * 1.02, r * 0.98 * d.w, 0, 0, Math.PI * 2); ctx.fill();
      const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.3, r * 0.1, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,.03)'); g.addColorStop(0.75, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(255,255,255,.28)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, r, r * d.w, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.beginPath(); ctx.ellipse(x + r * 0.32, y + r * 0.42, r * 0.38, r * 0.2, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath(); ctx.ellipse(x - r * 0.38, y - r * 0.42, r * 0.24, r * 0.15, -0.6, 0, Math.PI * 2); ctx.fill();
    }
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (!visible || !W) return;
      // Sem mouse por 2,5s: uma "mão invisível" passa sozinha
      let mx = mouse.x, my = mouse.y;
      if (now - mouse.t > 2500) {
        const k = now / 2600;
        mx = W * (0.5 + 0.38 * Math.sin(k)); my = H * (0.5 + 0.34 * Math.sin(k * 1.7 + 1));
      }
      ctx.drawImage(bg, 0, 0);
      const R0 = 130 * dpr;
      for (const d of drops) {
        const dx = d.x - mx, dy = d.y - my, dist = Math.hypot(dx, dy) || 1;
        if (dist < R0) { const f = (1 - dist / R0) * 2.2 * dpr; d.vx += (dx / dist) * f; d.vy += (dy / dist) * f; }
        if (d.r > 8 * dpr) d.vy += 0.035 * dpr * (d.r / (10 * dpr));
        d.vx *= 0.88; d.vy *= 0.88; d.x += d.vx; d.y += d.vy;
        if (d.y - d.r > H || d.x < -40 * dpr || d.x > W + 40 * dpr || d.y < -H * 0.5) Object.assign(d, newDrop(true));
        drawDrop(d);
      }
    }
    const onMove = (e) => { const r = canvas.getBoundingClientRect(); mouse = { x: (e.clientX - r.left) * dpr, y: (e.clientY - r.top) * dpr, t: performance.now() }; };
    const onLeave = () => { mouse = { x: -9999, y: -9999, t: 0 }; };
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerdown', onMove);
    canvas.addEventListener('pointerleave', onLeave);
    const ro = new ResizeObserver(setup); ro.observe(canvas);
    const io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; }); io.observe(canvas);
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); canvas.removeEventListener('pointermove', onMove); canvas.removeEventListener('pointerdown', onMove); canvas.removeEventListener('pointerleave', onLeave); };
  }, []);
  return <canvas ref={ref} className={`touch-pan-y ${className}`} role="img" aria-label="Gotas de água escorrendo de uma pintura com coating cerâmico" />;
}

function Gallery() {
  const desktop = useMedia('(min-width: 1024px)');
  const sec = useRef(null), track = useRef(null);
  const [dist, setDist] = useState(0);
  useEffect(() => {
    if (!desktop) return;
    const m = () => track.current && setDist(Math.max(0, track.current.scrollWidth - window.innerWidth));
    m(); const t = setTimeout(m, 600);
    window.addEventListener('resize', m);
    return () => { window.removeEventListener('resize', m); clearTimeout(t); };
  }, [desktop]);
  const { scrollYProgress } = useScroll({ target: sec, offset: ['start start', 'end end'] });
  const x = useTransform(scrollYProgress, (v) => -v * dist);
  const bar = useSpring(scrollYProgress, { stiffness: 120, damping: 30 });

  const head = (
    <div className="mx-auto flex w-full max-w-[1280px] items-end justify-between gap-6 px-5 md:px-8">

        <InstaIcon /> @streetdetailjaragua

    </div>
  );

  if (!desktop) {
    return (
      <section id="galeria" className="py-24">
        {head}
        <div className="no-scrollbar mt-10 flex snap-x snap-mandatory gap-4 overflow-x-auto px-5 pb-4">

        <div className="mt-6 px-5">
          <a href={INSTAGRAM} target="_blank" rel="noopener" className="inline-flex items-center gap-2 rounded-full border border-white/15 px-5 py-3 font-semibold text-white"><InstaIcon /> Ver mais no Instagram</a>

      </section>
    );

  return (
    <section id="galeria" ref={sec} className="relative" style={{ height: `calc(100vh + ${dist}px)` }}>
      <div className="sticky top-0 flex h-screen flex-col justify-center overflow-hidden pt-16">

  );

// Teste: index.html?y=1500 pula a intro e abre a página já rolada
const TEST_Y = new URLSearchParams(location.search).get('y');

function App() {
  const reduce = useReduce();
  const [intro, setIntro] = useState(TEST_Y === null);
  useSmoothScroll(!reduce && TEST_Y === null);
  useEffect(() => {
    document.getElementById('boot')?.remove();
    if (TEST_Y !== null) { document.body.style.marginTop = `-${+TEST_Y}px`; return; }
    const t = setTimeout(() => setIntro(false), reduce ? 0 : 1700);
    return () => clearTimeout(t);
  }, []);
  const ready = !intro;
  return (
    <MotionConfig reducedMotion={RESPECT_REDUCED_MOTION ? 'user' : 'never'}>
      <Intro show={intro} />
      <ScrollProgress />
      <Header ready={ready} />
      <main>
        <Hero ready={ready} />
        <SpeedStrip />
        <Services />
        <BeforeAfter />
        <Coating />
        <Process />
        <Gallery />
        <Specs />
        <Faq />
        <FinalCta />
      </main>
      <Footer />
      <WhatsFloat />
    </MotionConfig>
  );
}
